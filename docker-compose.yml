services:
  # Zookeeper for Kafka
  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: eventlineage-zookeeper
    restart: unless-stopped
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventlineage

  # Kafka broker
  kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: eventlineage-kafka
    restart: unless-stopped
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - eventlineage

  # Neo4j graph database
  neo4j:
    image: neo4j:5.15-community
    container_name: eventlineage-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"  # HTTP
      - "7687:7687"  # Bolt
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/eventlineage}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_dbms_memory_heap_initial__size: 512m
      NEO4J_dbms_memory_heap_max__size: 1G
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - eventlineage

  # EventLineage API server
  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: eventlineage-api
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      neo4j:
        condition: service_healthy
    ports:
      - "${API_PORT:-8080}:8080"
    environment:
      PORT: "8080"
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-eventlineage}
      KAFKA_BROKERS: kafka:29092
      KAFKA_GROUP_ID: ${KAFKA_GROUP_ID:-eventlineage-ingestion}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - eventlineage

  # DICOM Gateway (Service A)
  dicom-gateway:
    build:
      context: .
      dockerfile: services/dicom-gateway/Dockerfile
    container_name: dicom-gateway
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5001:5001"
    environment:
      PORT: "5001"
      KAFKA_BROKERS: kafka:29092
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5001/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - eventlineage

  # DICOM Processor (Service B)
  dicom-processor:
    build:
      context: .
      dockerfile: services/dicom-processor/Dockerfile
    container_name: dicom-processor
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "5002:5002"
    environment:
      PORT: "5002"
      KAFKA_BROKERS: kafka:29092
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5002/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
    networks:
      - eventlineage

  # React UI
  ui:
    build:
      context: ./ui
      dockerfile: Dockerfile
    container_name: eventlineage-ui
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${UI_PORT:-3000}:80"
    networks:
      - eventlineage

volumes:
  neo4j_data:
  neo4j_logs:

networks:
  eventlineage:
    driver: bridge
