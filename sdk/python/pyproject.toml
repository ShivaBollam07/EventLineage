[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eventlineage"
version = "1.0.0"
description = "Kafka instrumentation SDK for automatic message lineage tracking"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "EventLineage Team", email = "team@eventlineage.io"}
]
keywords = ["kafka", "lineage", "tracing", "observability", "distributed-systems"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Distributed Computing",
    "Topic :: System :: Monitoring",
]
requires-python = ">=3.9"
dependencies = [
    "confluent-kafka>=2.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "mypy>=1.0.0",
    "ruff>=0.1.0",
]

[project.urls]
Homepage = "https://github.com/eventlineage/eventlineage"
Documentation = "https://docs.eventlineage.io"
Repository = "https://github.com/eventlineage/eventlineage"

[tool.setuptools.packages.find]
where = ["."]
include = ["eventlineage*"]

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
select = ["E", "F", "I", "N", "W"]

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
